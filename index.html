<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fracture Sounds Patch Copy</title>
<style>
:root{--bg:#111315;--panel:#191c20;--panel2:#20242a;--line:#30363d;--text:#f2f4f7;--muted:#a9b0b8;--accent:#7dd3fc;--ok:#86efac}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Meiryo,sans-serif}
body{overflow:hidden}
header{height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:#14171a}
header h1{font-size:18px;margin:0;font-weight:650}
.status{margin-left:auto;color:var(--muted);font-size:13px}
.app{height:calc(100% - 58px);display:grid;grid-template-columns:360px 1fr}
.sidebar{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
.sectionHead{margin:12px 4px 5px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em}
.sectionHead:first-child{margin-top:2px}
.lib{width:100%;display:grid;grid-template-columns:1fr 42px;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}
.lib:hover{background:var(--panel2)} .lib.active{border-color:#4b5563;background:#252a31}
.libname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .count{font-size:12px;color:var(--muted);text-align:right}
.main{overflow:auto;padding:18px 22px 36px}
.topline{position:sticky;top:-18px;z-index:2;background:var(--bg);padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.titleline{display:flex;align-items:baseline;gap:12px} .titleline h2{font-size:22px;margin:0}
.sectionTag{color:var(--accent);font-size:12px;font-weight:700}
.alias{color:var(--muted);font-size:13px}
.help{color:var(--muted);font-size:13px;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.patch{min-height:48px;padding:10px 12px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;line-height:1.3}
.patch:hover{background:var(--panel2);border-color:#4b5563} .patch:active{transform:translateY(1px)}
.toast{position:fixed;right:20px;bottom:20px;background:#0f2317;color:var(--ok);border:1px solid #245b38;padding:12px 16px;border-radius:8px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.14s}
.toast.show{opacity:1;transform:none}
.rawtoggle{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer}
.raw{display:none;color:#8b949e;font-size:11px;margin-top:5px;word-break:break-all} .showraw .raw{display:block}
.placeholder{color:#6b7280;font-size:12px;padding:8px 10px}

.settingsBtn,.secondaryBtn,.primaryBtn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13px
}
.settingsBtn:hover,.secondaryBtn:hover{background:var(--panel2)}
.primaryBtn{background:#1d4ed8;border-color:#3b82f6;color:#fff}
.settingsPanel{
  position:fixed;inset:72px 24px 24px 24px;z-index:20;
  background:#15181c;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 60px rgba(0,0,0,.45);display:none;overflow:hidden
}
.settingsPanel.show{display:grid;grid-template-rows:auto 1fr auto}
.settingsHead,.settingsFoot{
  padding:14px 16px;display:flex;align-items:center;gap:10px
}
.settingsHead{border-bottom:1px solid var(--line)}
.settingsFoot{border-top:1px solid var(--line);justify-content:flex-end}
.settingsHead h3{margin:0;font-size:17px}
.settingsBody{overflow:auto;padding:14px 16px}
.settingsSection{margin-bottom:18px}
.settingsSection h4{margin:0 0 8px;color:var(--accent);font-size:13px}
.toggleRow{
  display:grid;grid-template-columns:22px 1fr 50px;align-items:center;gap:8px;
  padding:7px 8px;border-radius:7px
}
.toggleRow:hover{background:var(--panel2)}
.toggleRow input{width:16px;height:16px}
.toggleCount{color:var(--muted);font-size:12px;text-align:right}
.hiddenBadge{color:var(--muted);font-size:12px}


.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
  user-select:none;
  padding:4px 6px;
  border-radius:6px;
}
.sectionHead:hover{background:var(--panel2)}
.sectionHead .chev{
  color:var(--muted);
  font-size:11px;
  transition:transform .12s ease;
}
.sectionHead.collapsed .chev{transform:rotate(-90deg)}


.patchGroup{margin:0 0 16px}
.patchGroupHead{
  display:flex;align-items:center;gap:8px;
  margin:2px 0 8px;padding:7px 9px;
  border-radius:7px;background:#171a1e;
  color:var(--accent);font-size:13px;font-weight:700;
  cursor:pointer;user-select:none
}
.patchGroupHead:hover{background:var(--panel2)}
.patchGroupHead .gchev{font-size:10px;color:var(--muted);transition:transform .12s ease}
.patchGroupHead.collapsed .gchev{transform:rotate(-90deg)}
.patchGroupHead .gcount{margin-left:auto;color:var(--muted);font-weight:400}
.patchGroupGrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px
}


.unitList{margin:4px 0 8px 28px;padding-left:10px;border-left:1px solid var(--line)}
.unitRow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;padding:5px 7px;border-radius:6px}
.unitRow:hover{background:var(--panel2)}
.unitNote{font-size:11px;color:var(--muted);margin-left:4px}


.salesUnitBlock{margin:0 0 24px}
.salesUnitHead{
  margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:#111820;color:#fff;font-size:15px;font-weight:700;letter-spacing:.01em
}
.salesUnitSub{color:var(--muted);font-size:11px;font-weight:400;margin-left:8px}
.salesUnitBlock .patchGroup{margin-left:12px}


.salesUnitHead{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.salesUnitHead:hover{background:#16202a}
.salesUnitHead .uchev{font-size:10px;color:var(--muted);transition:transform .12s ease}
.salesUnitHead.collapsed .uchev{transform:rotate(-90deg)}
.salesUnitHead .unitCount{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.salesUnitFlatGrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;
  margin:0 12px 8px 12px
}

</style>
</head>
<body>
<header><h1>Fracture Sounds Patch Copy</h1><button class="settingsBtn" id="settingsBtn">表示設定</button><div class="status" id="status"></div></header>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
<div class="topline">
<div class="titleline">
<span class="sectionTag" id="sectionTag"></span>
<h2 id="libTitle"></h2>
<span class="alias" id="alias"></span>
<button class="rawtoggle" id="rawToggle">元ファイル名</button>
</div>
<div class="help">パッチをクリック → 完成したトラック名をクリップボードへコピー</div>
</div>
<div class="grid" id="patchGrid"></div>
</main>
</div>

<div class="settingsPanel" id="settingsPanel">
  <div class="settingsHead">
    <h3>表示する音源</h3>
    <span class="hiddenBadge" id="hiddenBadge"></span>
  </div>
  <div class="settingsBody" id="settingsBody"></div>
  <div class="settingsFoot">
    <button class="secondaryBtn" id="showAllBtn">すべて表示</button>
    <button class="secondaryBtn" id="hideAllBtn">すべて非表示</button>
    <button class="primaryBtn" id="closeSettingsBtn">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const SECTIONS=["Blueprint", "Fracture Sounds"];

const LIB_STORAGE_KEY='fsPatchCopy.hiddenLibraries.v1';
const SECTION_STORAGE_KEY='fsPatchCopy.hiddenSections.v1';
const COLLAPSE_STORAGE_KEY='fsPatchCopy.collapsedSections.v1';
const PATCH_COLLAPSE_STORAGE_KEY='fsPatchCopy.collapsedPatchGroups.v1';
const UNIT_STORAGE_KEY='fsPatchCopy.hiddenUnits.v1';
const UNIT_COLLAPSE_STORAGE_KEY='fsPatchCopy.collapsedUnits.v1';

let hidden=new Set(JSON.parse(localStorage.getItem(LIB_STORAGE_KEY)||'[]'));
let hiddenSections=new Set(JSON.parse(localStorage.getItem(SECTION_STORAGE_KEY)||'[]'));
let collapsedSections=new Set(JSON.parse(localStorage.getItem(COLLAPSE_STORAGE_KEY)||'[]'));
let collapsedPatchGroups=new Set(JSON.parse(localStorage.getItem(PATCH_COLLAPSE_STORAGE_KEY)||'[]'));
let hiddenUnits=new Set(JSON.parse(localStorage.getItem(UNIT_STORAGE_KEY)||'[]'));
let collapsedUnits=new Set(JSON.parse(localStorage.getItem(UNIT_COLLAPSE_STORAGE_KEY)||'[]'));
let current=0;

const sidebar=document.getElementById('sidebar');
const patchGrid=document.getElementById('patchGrid');
const libTitle=document.getElementById('libTitle');
const alias=document.getElementById('alias');
const sectionTag=document.getElementById('sectionTag');
const toast=document.getElementById('toast');
const main=document.getElementById('main');
const settingsPanel=document.getElementById('settingsPanel');
const settingsBody=document.getElementById('settingsBody');
const hiddenBadge=document.getElementById('hiddenBadge');

function libId(lib){return lib.section+'::'+lib.displayName;}
function unitId(lib,unit){return lib.section+'::'+lib.displayName+'::'+unit;}
function saveState(){
 localStorage.setItem(LIB_STORAGE_KEY,JSON.stringify([...hidden]));
 localStorage.setItem(SECTION_STORAGE_KEY,JSON.stringify([...hiddenSections]));
 localStorage.setItem(COLLAPSE_STORAGE_KEY,JSON.stringify([...collapsedSections]));
 localStorage.setItem(PATCH_COLLAPSE_STORAGE_KEY,JSON.stringify([...collapsedPatchGroups]));
 localStorage.setItem(UNIT_STORAGE_KEY,JSON.stringify([...hiddenUnits]));
 localStorage.setItem(UNIT_COLLAPSE_STORAGE_KEY,JSON.stringify([...collapsedUnits]));
}
function visibleUnits(lib){return (lib.units||[lib.displayName]).filter(u=>!hiddenUnits.has(unitId(lib,u)));}
function isLibraryVisible(lib){
 return !hiddenSections.has(lib.section) && !hidden.has(libId(lib)) && visibleUnits(lib).length>0;
}
function visibleLibraries(){return DATA.filter(isLibraryVisible);}

function updateStatus(){
 const vis=visibleLibraries();
 let patches=0;
 vis.forEach(lib=>{
   if(lib.groups||lib.unitPatches){
     if(lib.groups) patches+=lib.groups.filter(g=>!hiddenUnits.has(unitId(lib,g.unit||lib.displayName))).reduce((a,g)=>a+g.patches.length,0);
     if(lib.unitPatches) patches+=Object.keys(lib.unitPatches).filter(u=>!hiddenUnits.has(unitId(lib,u))).reduce((a,u)=>a+lib.unitPatches[u].length,0);
   } else patches+=lib.patches.length;
 });
 document.getElementById('status').textContent=`${vis.length} / ${DATA.length} 音源表示・${patches} パッチ`;
}
function fallbackCopy(text){
 const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
 document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;
}
async function copyText(text){
 let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
 if(!ok)ok=fallbackCopy(text);
 toast.textContent=ok?`コピー: ${text}`:`コピー失敗: ${text}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200);
}
function ensureCurrentVisible(){
 if(!DATA.length)return;
 if(!isLibraryVisible(DATA[current])){
   const idx=DATA.findIndex(isLibraryVisible);current=idx>=0?idx:0;
 }
}
function toggleCollapse(section){
 if(collapsedSections.has(section))collapsedSections.delete(section);else collapsedSections.add(section);
 saveState();renderSidebar();
}
function patchGroupId(lib,group){return lib.displayName+'::'+group;}
function togglePatchGroup(lib,group){
 const id=patchGroupId(lib,group);
 if(collapsedPatchGroups.has(id))collapsedPatchGroups.delete(id);else collapsedPatchGroups.add(id);
 saveState();renderMain(false);
}
function salesUnitCollapseId(lib,unit){return lib.displayName+'::UNIT::'+unit;}
function toggleSalesUnit(lib,unit){
 const id=salesUnitCollapseId(lib,unit);
 if(collapsedUnits.has(id))collapsedUnits.delete(id);else collapsedUnits.add(id);
 saveState();renderMain(false);
}

function renderSidebar(){
 sidebar.innerHTML='';
 SECTIONS.forEach(section=>{
   if(hiddenSections.has(section))return;
   const collapsed=collapsedSections.has(section);
   const h=document.createElement('div');h.className='sectionHead'+(collapsed?' collapsed':'');
   h.innerHTML=`<span>${section}</span><span class="chev">▼</span>`;
   h.onclick=()=>toggleCollapse(section);sidebar.appendChild(h);
   if(collapsed)return;

   const libs=DATA.map((x,i)=>({x,i})).filter(o=>o.x.section===section&&isLibraryVisible(o.x));
   libs.sort((a,b)=>a.x.displayName.localeCompare(b.x.displayName));
   if(!libs.length){
     const p=document.createElement('div');p.className='placeholder';
     p.textContent='非表示またはなし';sidebar.appendChild(p);return;
   }
   libs.forEach(o=>{
     let count=0;
     if(o.x.groups||o.x.unitPatches){
       if(o.x.groups)count+=o.x.groups.filter(g=>!hiddenUnits.has(unitId(o.x,g.unit||o.x.displayName))).reduce((a,g)=>a+g.patches.length,0);
       if(o.x.unitPatches)count+=Object.keys(o.x.unitPatches).filter(u=>!hiddenUnits.has(unitId(o.x,u))).reduce((a,u)=>a+o.x.unitPatches[u].length,0);
     }else count=o.x.patches.length;
     const b=document.createElement('button');b.className='lib'+(o.i===current?' active':'');
     b.innerHTML=`<span class="libname">${o.x.displayName}</span><span class="count">${count}</span>`;
     b.onclick=()=>{current=o.i;renderSidebar();renderMain();};sidebar.appendChild(b);
   });
 });
}

function renderMain(resetScroll=true){
 ensureCurrentVisible();
 const vis=visibleLibraries();
 if(!vis.length){
   sectionTag.textContent='';libTitle.textContent='表示する音源がありません';alias.textContent='';
   patchGrid.innerHTML='<div class="placeholder">「表示設定」から分類またはライブラリを表示してください。</div>';return;
 }
 const lib=DATA[current];
 sectionTag.textContent=lib.section;libTitle.textContent=lib.displayName;
 alias.textContent=`コピー名: ${lib.copyPrefix} - …`;patchGrid.innerHTML='';

 const makeButton=(p,unitName='')=>{
   const b=document.createElement('button');b.className='patch';
   b.innerHTML=`<div>${p.name}</div><div class="raw">${p.raw}</div>`;
   b.onclick=()=>{
     let name=p.name;
     copyText(`${lib.copyPrefix} - ${name}`);
   };
   return b;
 };

 if((lib.groups&&lib.groups.length) || (lib.unitPatches && Object.keys(lib.unitPatches).length)){
   patchGrid.style.display='block';
   const unitOrder=(lib.units&&lib.units.length)?lib.units:[lib.displayName];

   unitOrder.forEach(unit=>{
     if(hiddenUnits.has(unitId(lib,unit)))return;

     const unitGroups=(lib.groups||[]).filter(g=>(g.unit||lib.displayName)===unit);
     const unitFlat=(lib.unitPatches&&lib.unitPatches[unit]) ? lib.unitPatches[unit] : [];
     if(!unitGroups.length && !unitFlat.length)return;

     const unitBlock=document.createElement('section');
     unitBlock.className='salesUnitBlock';

     const multiUnit=unitOrder.length>1;
     const collapsed=collapsedUnits.has(salesUnitCollapseId(lib,unit));

     if(multiUnit){
       const total=unitFlat.length + unitGroups.reduce((a,g)=>a+g.patches.length,0);
       const uh=document.createElement('div');
       uh.className='salesUnitHead'+(collapsed?' collapsed':'');
       uh.innerHTML=`<span class="uchev">▼</span><span>${unit}</span><span class="salesUnitSub">Library</span><span class="unitCount">${total}</span>`;
       uh.onclick=()=>toggleSalesUnit(lib,unit);
       unitBlock.appendChild(uh);
     }

     if(!collapsed || !multiUnit){
       if(unitFlat.length){
         const grid=document.createElement('div');
         grid.className='salesUnitFlatGrid';
         unitFlat.forEach(p=>grid.appendChild(makeButton(p,unit)));
         unitBlock.appendChild(grid);
       }

       unitGroups.forEach(group=>{
         const wrap=document.createElement('section');wrap.className='patchGroup';
         const gid=patchGroupId(lib,group.name),gcollapsed=collapsedPatchGroups.has(gid);
         const head=document.createElement('div');head.className='patchGroupHead'+(gcollapsed?' collapsed':'');
         head.innerHTML=`<span class="gchev">▼</span><span>${group.name}</span><span class="gcount">${group.patches.length}</span>`;
         head.onclick=()=>togglePatchGroup(lib,group.name);wrap.appendChild(head);
         if(!gcollapsed){
           const grid=document.createElement('div');grid.className='patchGroupGrid';
           group.patches.forEach(p=>grid.appendChild(makeButton(p,unit)));
           wrap.appendChild(grid);
         }
         unitBlock.appendChild(wrap);
       });
     }

     patchGrid.appendChild(unitBlock);
   });
 }else{
   patchGrid.style.display='grid';
   lib.patches.forEach(p=>patchGrid.appendChild(makeButton(p,'')));
 }
 if(resetScroll)main.scrollTop=0;
}

function renderSettings(){
 settingsBody.innerHTML='';
 SECTIONS.forEach(section=>{
   const libs=DATA.filter(x=>x.section===section).sort((a,b)=>a.displayName.localeCompare(b.displayName));
   const wrap=document.createElement('div');wrap.className='settingsSection';
   const headerRow=document.createElement('label');headerRow.className='toggleRow';headerRow.style.fontWeight='700';
   const sectionCb=document.createElement('input');sectionCb.type='checkbox';sectionCb.checked=!hiddenSections.has(section);
   sectionCb.onchange=()=>{if(sectionCb.checked)hiddenSections.delete(section);else hiddenSections.add(section);saveState();renderSettings();updateStatus();};
   const h=document.createElement('span');h.textContent=section;
   const count=document.createElement('span');count.className='toggleCount';count.textContent=libs.length;
   headerRow.append(sectionCb,h,count);wrap.appendChild(headerRow);

   if(libs.length){
     const child=document.createElement('div');child.style.marginLeft='18px';child.style.opacity=hiddenSections.has(section)?'.45':'1';
     libs.forEach(lib=>{
       const units=lib.units||[lib.displayName];
       if(units.length===1){
         const row=document.createElement('label');row.className='toggleRow';
         const cb=document.createElement('input');cb.type='checkbox';cb.checked=!hiddenUnits.has(unitId(lib,units[0]));cb.disabled=hiddenSections.has(section);
         cb.onchange=()=>{if(cb.checked)hiddenUnits.delete(unitId(lib,units[0]));else hiddenUnits.add(unitId(lib,units[0]));saveState();updateStatus();};
         const name=document.createElement('span');name.textContent=lib.displayName;
         const pc=document.createElement('span');pc.className='toggleCount';pc.textContent=lib.patches.length;
         row.append(cb,name,pc);child.appendChild(row);
       }else{
         const fam=document.createElement('div');fam.className='toggleRow';fam.style.fontWeight='600';
         const spacer=document.createElement('span');const name=document.createElement('span');name.textContent=lib.displayName;
         const cnt=document.createElement('span');cnt.className='toggleCount';cnt.textContent=units.length;
         fam.append(spacer,name,cnt);child.appendChild(fam);
         const ul=document.createElement('div');ul.className='unitList';
         units.forEach(unit=>{
           const row=document.createElement('label');row.className='unitRow';
           const cb=document.createElement('input');cb.type='checkbox';cb.checked=!hiddenUnits.has(unitId(lib,unit));cb.disabled=hiddenSections.has(section);
           cb.onchange=()=>{if(cb.checked)hiddenUnits.delete(unitId(lib,unit));else hiddenUnits.add(unitId(lib,unit));saveState();updateStatus();};
           const n=document.createElement('span');n.textContent=unit;row.append(cb,n);ul.appendChild(row);
         });
         child.appendChild(ul);
       }
     });
     wrap.appendChild(child);
   }
   settingsBody.appendChild(wrap);
 });
 hiddenBadge.textContent=`非表示分類 ${hiddenSections.size}`;
}

document.getElementById('rawToggle').onclick=()=>document.body.classList.toggle('showraw');
document.getElementById('settingsBtn').onclick=()=>{renderSettings();settingsPanel.classList.add('show');};
document.getElementById('closeSettingsBtn').onclick=()=>{settingsPanel.classList.remove('show');ensureCurrentVisible();renderSidebar();renderMain();updateStatus();};
document.getElementById('showAllBtn').onclick=()=>{hidden.clear();hiddenSections.clear();hiddenUnits.clear();saveState();renderSettings();renderSidebar();renderMain();updateStatus();};
document.getElementById('hideAllBtn').onclick=()=>{
 hiddenSections=new Set(SECTIONS);
 DATA.forEach(lib=>(lib.units||[lib.displayName]).forEach(u=>hiddenUnits.add(unitId(lib,u))));
 saveState();renderSettings();renderSidebar();renderMain();updateStatus();
};

ensureCurrentVisible();renderSidebar();renderMain();updateStatus();

</script>
</body></html>
